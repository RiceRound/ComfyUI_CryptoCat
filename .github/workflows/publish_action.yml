name: Publish to Comfy Registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish-node:
    if: github.repository == 'RiceRound/ComfyUI_CryptoCat' && github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the release version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as metadata:
              version = tomllib.load(metadata)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match project version {version!r}.")
          PY

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
